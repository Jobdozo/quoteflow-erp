name: 🚀 QuoteFlow ERP — Deploy to Cloud & Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────
  # JOB 1: Deploy Web App to GitHub Pages (Cloud)
  # ────────────────────────────────────────────────
  deploy-cloud:
    name: 🌐 Deploy to GitHub Pages (Cloud Access)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: '🌐 Cloud deploy: QuoteFlow ERP v${{ github.run_number }}'

  # ────────────────────────────────────────────────
  # JOB 2: Build Windows Desktop .exe on new version tag
  # ────────────────────────────────────────────────
  build-windows:
    name: 🖥️ Build Windows .exe Installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production web bundle
        run: npm run build

      - name: Build dist-electron CJS files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-electron
          Copy-Item electron/main.ts dist-electron/main.cjs
          Copy-Item electron/preload.ts dist-electron/preload.cjs

      - name: Package Windows .exe with electron-builder
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────
  # JOB 3: Enable GitHub Pages on first run
  # ────────────────────────────────────────────────
  enable-pages:
    name: ⚙️ Configure GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-cloud
    steps:
      - name: Done
        run: echo "GitHub Pages is live at https://jobdozo.github.io/quoteflow-erp/"
